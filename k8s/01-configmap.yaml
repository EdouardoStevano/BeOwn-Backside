apiVersion: v1
kind: ConfigMap
metadata:
  name: beown-config
  namespace: beown
data:
  NODE_ENV: "production"
  PORT: "3000"

  # Database (host = service name interne k8s)
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_DB: "beown"

  # Redis (host = service name interne k8s)
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # JWT (durées en secondes)
  JWT_TOKEN_AUDIENCE: "https://api.beown.com"
  JWT_TOKEN_ISSUER: "https://api.beown.com"
  JWT_ACCESS_TOKEN_TTL: "900"
  JWT_REFRESH_TOKEN_TTL: "604800"
  JWT_TOKEN_EMAIL_TTL: "604800"

  # Mail
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_FROM: "no-reply@beown.com"

  # Brevo
  BREVO_SENDER_EMAIL: "no-reply@beown.com"
  BREVO_SENDER_NAME: "BeOwn"

  # Twilio
  TWILIO_PHONE_NUMBER: "+33XXXXXXXXX"

  # OAuth callbacks (remplacer par le vrai domaine)
  GOOGLE_CALLBACK_URL: "https://api.beown.com/iam/auth/google/callback"
  FACEBOOK_CALLBACK_URL: "https://api.beown.com/iam/auth/facebook/callback"
  LINKEDIN_CALLBACK_URL: "https://api.beown.com/iam/auth/linkedin/callback"

  # App
  FRONTEND_URL: "https://app.beown.com"
  TFA_APP_NAME: "BeOwn"

  # PSFP / Régulation
  PLAFOND_INVESTISSEMENT_NON_AVERTI_EUR: "1000"
  PLAFOND_INVESTISSEMENT_AVERTI_EUR: "100000"

  # KYC
  KYC_PROVIDER: "sumsubapp"
