apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environnement STAGING — branche `staging`
namespace: beown-staging

resources:
  - ../../base

patches:
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: beown-backend-config
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: beown-backend-ingress
