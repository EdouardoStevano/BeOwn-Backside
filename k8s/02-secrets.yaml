# IMPORTANT : Ne jamais committer ce fichier avec de vraies valeurs dans git.
# Encoder chaque valeur en base64 : echo -n "ma_valeur" | base64
#
# Pour créer les secrets depuis .env.production.local directement :
#   kubectl create secret generic beown-secrets \
#     --from-env-file=.env.production.local \
#     --namespace=beown --dry-run=client -o yaml > k8s/02-secrets.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: beown-secrets
  namespace: beown
type: Opaque
stringData:
  # Database
  DATABASE_USERNAME: "CHANGE_ME"
  DATABASE_PASSWORD: "CHANGE_ME"

  # JWT
  JWT_SECRET: "CHANGE_ME_long_random_secret_min_32_chars"

  # Mail
  MAIL_USER: "CHANGE_ME"
  MAIL_USER_PASSWORD: "CHANGE_ME"

  # Brevo
  BREVO_API_KEY: "CHANGE_ME"

  # Twilio
  TWILIO_ACCOUNT_SID: "CHANGE_ME"
  TWILIO_AUTH_TOKEN: "CHANGE_ME"

  # Stripe
  STRIPE_SECRET_KEY: "CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "CHANGE_ME"

  # OAuth – Google
  GOOGLE_CLIENT_ID: "CHANGE_ME"
  GOOGLE_CLIENT_SECRET: "CHANGE_ME"

  # OAuth – Facebook
  FACEBOOK_CLIENT_ID: "CHANGE_ME"
  FACEBOOK_CLIENT_SECRET: "CHANGE_ME"

  # OAuth – LinkedIn
  LINKEDIN_CLIENT_ID: "CHANGE_ME"
  LINKEDIN_CLIENT_SECRET: "CHANGE_ME"

  # KYC – Sumsub
  SUMSUB_APP_TOKEN: "CHANGE_ME"
  SUMSUB_SECRET_KEY: "CHANGE_ME"
  SUMSUB_WEBHOOK_SECRET: "CHANGE_ME"

  # Cloudinary (si utilisé)
  CLOUDINARY_CLOUD_NAME: "CHANGE_ME"
  CLOUDINARY_API_KEY: "CHANGE_ME"
  CLOUDINARY_API_SECRET: "CHANGE_ME"
