apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: beown-backend-secrets
# ─────────────────────────────────────────────────────────────────────────────
# TEMPLATE — à ne PAS remplir dans Git.
#
# Les secrets ne sont volontairement pas gérés par Kustomize (pour ne jamais
# les committer). Procédure pour créer le Secret dans un namespace :
#
#   1. Copier ce fichier en `secrets.yaml` (déjà gitignoré) :
#        cp k8s/base/secrets.example.yaml k8s/base/secrets.yaml
#   2. Remplir les VRAIES valeurs ci-dessous (en clair : `stringData`).
#   3. Créer le Secret dans chaque namespace :
#        kubectl create namespace beown-dev --dry-run=client -o yaml | kubectl apply -f -
#        kubectl apply -n beown-dev -f k8s/base/secrets.yaml
#      (répéter avec beown-staging, beown-test, beown)
#
# `stringData` accepte du texte en clair — Kubernetes l'encode en base64 tout seul.
# ─────────────────────────────────────────────────────────────────────────────
stringData:
  DATABASE_USERNAME: 'CHANGE_ME'
  DATABASE_PASSWORD: 'CHANGE_ME'
  JWT_SECRET: 'CHANGE_ME'
  PROJECT_SHARE_SECRET: 'CHANGE_ME'

  # ─── Clés dédiées — OBLIGATOIRES ──────────────────────────────────────────
  # Ces deux clés avaient un repli SILENCIEUX sur JWT_SECRET : le service
  # démarrait, tout fonctionnait, et rien n'indiquait que trois usages sans
  # rapport partageaient la même clé. Le repli a été SUPPRIMÉ.
  #
  # Ce qu'il coûtait : le jour où JWT_SECRET est tourné (opération normale,
  # qui « ne fait que » déconnecter tout le monde), les parcours OAuth en
  # cours cassaient et TOUS les secrets TOTP devenaient illisibles — chaque
  # utilisateur perdait son second facteur, sans que rien ne relie l'effet à
  # sa cause.
  #
  # ⚠ DÉPLOIEMENT — les renseigner AVANT de déployer cette version :
  #   - OAUTH_STATE_SECRET absente ⇒ le pod ne démarre pas dès qu'une
  #     stratégie OAuth est chargée ;
  #   - MFA_SECRET_ENCRYPTION_KEY absente ⇒ toute opération TOTP échoue.
  #
  # MIGRATION DES SECRETS TOTP DÉJÀ EN BASE : ils ont été chiffrés avec
  # l'ancienne clé (JWT_SECRET, ou TFA_SECRET_ENCRYPTION_KEY). Tant que
  # MFA_LEGACY_KEY_FALLBACK vaut `true` (défaut) et que l'ancienne variable
  # reste présente dans l'environnement, la LECTURE les retrouve ; l'écriture
  # utilise toujours la nouvelle clé. Ne PAS retirer JWT_SECRET de
  # l'environnement avant que les facteurs aient été ré-enrôlés, ou une
  # rotation hors ligne effectuée.
  # Générer chacune avec : openssl rand -hex 32
  OAUTH_STATE_SECRET: 'CHANGE_ME'
  MFA_SECRET_ENCRYPTION_KEY: 'CHANGE_ME'

  # ─── Prestataire de paiement mobile money (historique) ────────────────────
  # Déplacée du ConfigMap, où elle était versionnée en clair et lisible par
  # quiconque a `get configmaps` sur le namespace. CINETPAY_SITE_ID reste au
  # ConfigMap : identifiant marchand, pas secret d'authentification.
  CINETPAY_API_KEY: 'CHANGE_ME'

  # ─── Anti-robot (protège POST /auth/sign-up) ─────────────────────────────
  # ⚠ OBLIGATOIRE EN PRODUCTION. Depuis le durcissement de
  # recaptcha.service.ts, son absence en production ne désactive plus le
  # CAPTCHA en silence : les routes protégées répondent 503, et une erreur
  # explicite est journalisée au démarrage du pod. C'est délibéré — l'ancien
  # comportement ouvrait l'inscription à la création de comptes en masse sans
  # qu'aucun signal ne le révèle.
  # Clé SERVEUR (pas la site key du front) : https://www.google.com/recaptcha/admin
  RECAPTCHA_SECRET_KEY: 'CHANGE_ME'
  MAIL_USER: 'CHANGE_ME'
  MAIL_USER_PASSWORD: 'CHANGE_ME'
  BREVO_API_KEY: 'CHANGE_ME'
  TWILIO_ACCOUNT_SID: 'CHANGE_ME'
  TWILIO_AUTH_TOKEN: 'CHANGE_ME'
  STRIPE_SECRET_KEY: 'CHANGE_ME'
  STRIPE_WEBHOOK_SECRET: 'CHANGE_ME'
  GOOGLE_CLIENT_ID: 'CHANGE_ME'
  GOOGLE_CLIENT_SECRET: 'CHANGE_ME'
  FACEBOOK_APP_ID: 'CHANGE_ME'
  FACEBOOK_APP_SECRET: 'CHANGE_ME'
  LINKEDIN_CLIENT_ID: 'CHANGE_ME'
  LINKEDIN_CLIENT_SECRET: 'CHANGE_ME'
  SUMSUB_APP_TOKEN: 'CHANGE_ME'
  SUMSUB_SECRET_KEY: 'CHANGE_ME'
  SUMSUB_WEBHOOK_SECRET: 'CHANGE_ME'
  FEDAPAY_SECRET_KEY: 'CHANGE_ME'
  CLOUDINARY_API_KEY: 'CHANGE_ME'
  CLOUDINARY_API_SECRET: 'CHANGE_ME'
  YOUSIGN_API_KEY: 'CHANGE_ME'
  YOUSIGN_WEBHOOK_SECRET: 'CHANGE_ME'
  # Observabilité (OBS-1/OBS-4) — DSN Sentry (région UE) et jeton /metrics.
  # METRICS_TOKEN doit être IDENTIQUE au secret `beown-metrics-token` du
  # namespace `monitoring` consommé par Alloy (k8s/monitoring/alloy-values.yaml).
  #
  # ⚠ METRICS_TOKEN est à renseigner dans TOUS les namespaces, pas seulement
  # `beown` : depuis le durcissement fail-closed du contrôleur, le jeton est
  # exigé partout SAUF NODE_ENV=development. Sur beown-dev / beown-staging /
  # beown-test, un jeton absent ne laisse plus /metrics ouvert — il rend 403,
  # et le scrape Alloy échoue tant que le secret n'est pas posé.
  SENTRY_DSN: 'CHANGE_ME'
  METRICS_TOKEN: 'CHANGE_ME'
