apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: beown-backend-secrets
# ─────────────────────────────────────────────────────────────────────────────
# TEMPLATE — à ne PAS remplir dans Git.
#
# Les secrets ne sont volontairement pas gérés par Kustomize (pour ne jamais
# les committer). Procédure pour créer le Secret dans un namespace :
#
#   1. Copier ce fichier en `secrets.yaml` (déjà gitignoré) :
#        cp k8s/base/secrets.example.yaml k8s/base/secrets.yaml
#   2. Remplir les VRAIES valeurs ci-dessous (en clair : `stringData`).
#   3. Créer le Secret dans chaque namespace :
#        kubectl create namespace beown-dev --dry-run=client -o yaml | kubectl apply -f -
#        kubectl apply -n beown-dev -f k8s/base/secrets.yaml
#      (répéter avec beown-staging, beown-test, beown)
#
# `stringData` accepte du texte en clair — Kubernetes l'encode en base64 tout seul.
# ─────────────────────────────────────────────────────────────────────────────
stringData:
  DATABASE_USERNAME: 'CHANGE_ME'
  DATABASE_PASSWORD: 'CHANGE_ME'
  JWT_SECRET: 'CHANGE_ME'
  PROJECT_SHARE_SECRET: 'CHANGE_ME'
  MAIL_USER: 'CHANGE_ME'
  MAIL_USER_PASSWORD: 'CHANGE_ME'
  BREVO_API_KEY: 'CHANGE_ME'
  TWILIO_ACCOUNT_SID: 'CHANGE_ME'
  TWILIO_AUTH_TOKEN: 'CHANGE_ME'
  STRIPE_SECRET_KEY: 'CHANGE_ME'
  STRIPE_WEBHOOK_SECRET: 'CHANGE_ME'
  GOOGLE_CLIENT_ID: 'CHANGE_ME'
  GOOGLE_CLIENT_SECRET: 'CHANGE_ME'
  FACEBOOK_APP_ID: 'CHANGE_ME'
  FACEBOOK_APP_SECRET: 'CHANGE_ME'
  LINKEDIN_CLIENT_ID: 'CHANGE_ME'
  LINKEDIN_CLIENT_SECRET: 'CHANGE_ME'
  SUMSUB_APP_TOKEN: 'CHANGE_ME'
  SUMSUB_SECRET_KEY: 'CHANGE_ME'
  SUMSUB_WEBHOOK_SECRET: 'CHANGE_ME'
  FEDAPAY_SECRET_KEY: 'CHANGE_ME'
  CLOUDINARY_API_KEY: 'CHANGE_ME'
  CLOUDINARY_API_SECRET: 'CHANGE_ME'
  YOUSIGN_API_KEY: 'CHANGE_ME'
  YOUSIGN_WEBHOOK_SECRET: 'CHANGE_ME'
