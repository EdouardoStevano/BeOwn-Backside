apiVersion: v1
kind: ConfigMap
metadata:
  name: beown-backend-config
data:
  # ─── Valeurs COMMUNES à tous les environnements ───────────
  # Les clés spécifiques à un environnement (NODE_ENV + toutes les URLs)
  # sont définies dans overlays/<env>/configmap-patch.yaml
  PORT: '8080'

  # Database (Service k8s défini dans postgres.yaml)
  DATABASE_HOST: 'postgres-service'
  DATABASE_PORT: '5432'
  DATABASE_DB: 'beown'

  # Redis (Service k8s défini dans redis.yaml)
  REDIS_HOST: 'redis-service'
  REDIS_PORT: '6379'

  # ─── Limitation de débit ──────────────────────────────────────
  # Deux filets GLOBAUX appliqués à toutes les routes (vitrine publique
  # comprise). Ces valeurs étaient écrites en dur dans app.module.ts : les
  # sortir ici permet de resserrer sous attaque ou de desserrer sur un pic
  # légitime sans reconstruire l'image.
  #
  # Une valeur non entière ou <= 0 fait ÉCHOUER LE DÉMARRAGE du pod (une
  # limite qu'on croit appliquée et qui est retombée en silence sur son défaut
  # est pire que pas de limite).
  #
  # ⚠ Le palier `auth` n'apparaît PAS ici : il n'est plus global. Déclaré
  # globalement (500 req/15 min par IP + verrou de 15 min), il refusait 97,8 %
  # du trafic ANONYME dès 34 req/s — Googlebot et tout NAT d'entreprise
  # inclus. Il vit désormais sur les seules routes qui le posent
  # (`@Throttle({ auth: … })` : sign-in, OTP, reset de mot de passe, MFA,
  # vérification d'email), où ses budgets sont codés au plus juste.
  THROTTLE_SHORT_TTL: '1000'
  THROTTLE_SHORT_LIMIT: '500'
  THROTTLE_MEDIUM_TTL: '60000'
  THROTTLE_MEDIUM_LIMIT: '2000'

  # Nombre de proxys de confiance devant l'application (M-5). Sans cela,
  # `req.ip` vaut l'IP de l'ingress pour TOUS les clients : la limitation de
  # débit devient un seau commun et n'isole plus l'attaquant.
  # 1 = un seul ingress. À augmenter si une couche supplémentaire (CDN, LB L7)
  # ajoute un saut à X-Forwarded-For — jamais à mettre plus haut que le nombre
  # réel de proxys, sous peine de laisser un client falsifier son IP.
  TRUST_PROXY_HOPS: '1'

  # JWT (les URLs audience/issuer sont dans l'overlay)
  JWT_ACCESS_TOKEN_TTL: '3600'
  JWT_REFRESH_TOKEN_TTL: '86400'
  JWT_TOKEN_EMAIL_TTL: '86400'

  # OTP
  OTP_TTL: '300'
  MAX_ATTEMPTS: '5'

  # Mail (MAIL_USER est dans les secrets)
  MAIL_HOST: 'smtp.gmail.com'
  MAIL_PORT: '587'
  MAIL_FROM: 'beown@mail.com'

  # Brevo
  BREVO_SENDER_EMAIL: 'edouardostevano@gmail.com'
  BREVO_SENDER_NAME: 'BeOwn'

  # Twilio
  TWILIO_PHONE_NUMBER: '+261326507613'

  # App
  TFA_APP_NAME: 'BeOwn'

  # Documentation d'API (Swagger, /api/docs) — FERMÉE par défaut.
  # Le code ne l'expose que si cette valeur vaut exactement 'true'
  # (src/main.ts). L'ancienne condition `NODE_ENV !== 'production'` la publiait
  # en accès libre sur dev, staging ET test, c'est-à-dire trois domaines
  # ouverts sur Internet : cartographie complète des routes et des payloads
  # offerte à qui la demande. Ne passer à 'true' que temporairement, sur un
  # environnement précis, et le remettre à 'false' ensuite.
  SWAGGER_ENABLED: 'false'

  # ─── Surveillance LCB-FT (AML) ────────────────────────────────
  # Seuils de déclenchement d'une alerte, en EUR. Repris des valeurs codées en
  # dur dans src/common/aml/aml-monitor.service.ts (10 000 / 50 000) : elles
  # étaient les défauts du code, invisibles depuis la configuration, donc
  # impossibles à ajuster sans redéployer une image.
  #
  # ⚠ SEUILS À ARBITRER — ces valeurs sont des défauts techniques, PAS une
  # position de conformité. Le seuil pertinent dépend du régime applicable au
  # véhicule et du marché cible, deux points encore en suspens (voir
  # docs/conformite/). À trancher avec le responsable conformité avant
  # l'ouverture au public, et à documenter dans le registre LCB-FT.
  AML_THRESHOLD_SINGLE: '10000'
  AML_THRESHOLD_MONTHLY: '50000'

  # Inject the real value from the Kubernetes Secret, never from this ConfigMap.

  # KYC
  KYC_PROVIDER: 'stripe'
  SUMSUB_LEVEL_NAME: 'id-and-liveness'

  # Payment providers
  FEDAPAY_ENV: 'sandbox'
  # CINETPAY_API_KEY a été déplacée vers le Secret (secrets.example.yaml) :
  # une clé d'API de prestataire de paiement n'a rien à faire dans un
  # ConfigMap, lisible par quiconque a le droit `get configmaps` sur le
  # namespace et versionné en clair. CINETPAY_SITE_ID reste ici : c'est un
  # identifiant de compte marchand, pas un secret d'authentification.
  CINETPAY_SITE_ID: 'your-cinetpay-site-id'

  # Cloudinary
  CLOUDINARY_CLOUD_NAME: 'dcneqd0dz'

  # PSFP / Régulation
  PLAFOND_INVESTISSEMENT_NON_AVERTI_EUR: '1000'
  PLAFOND_INVESTISSEMENT_AVERTI_EUR: '100000'

  # Observabilité (monitoring managé — Grafana Cloud EU / Sentry EU). Valeurs
  # communes ; SENTRY_ENVIRONMENT/OTEL_DEPLOYMENT_ENVIRONMENT sont surchargées
  # par overlay (voir overlays/<env>/configmap-patch.yaml). SENTRY_DSN et
  # METRICS_TOKEN sont des secrets (beown-backend-secrets), jamais ici.
  LOG_LEVEL: 'info'
  OTEL_EXPORTER_OTLP_ENDPOINT: 'http://alloy.monitoring.svc.cluster.local:4317'
  OTEL_SERVICE_NAME: 'beown-api'
  SENTRY_TRACES_SAMPLE_RATE: '0.1'
