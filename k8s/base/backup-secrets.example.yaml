apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: beown-backup-secrets
# ─────────────────────────────────────────────────────────────────────────────
# TEMPLATE — À COMPLÉTER, à ne JAMAIS remplir dans Git.
#
# Consommé par k8s/base/backup-cronjob.yaml. Tant que ce Secret n'existe pas
# dans le namespace, le CronJob de sauvegarde échoue à chaque exécution
# (`CreateContainerConfigError`) — et il n'y a donc AUCUNE sauvegarde.
#
# Comme secrets.example.yaml, ce Secret n'est volontairement pas géré par
# Kustomize : il est créé hors-Git dans chaque namespace.
#
#   1. cp k8s/base/backup-secrets.example.yaml k8s/base/backup-secrets.yaml
#      (le motif `k8s/**/secrets.yaml` du .gitignore ne couvre PAS ce nom :
#       vérifier qu'il est bien ignoré avant tout commit, ou le renommer)
#   2. Renseigner les valeurs réelles ci-dessous.
#   3. kubectl apply -n beown -f k8s/base/backup-secrets.yaml
#      (répéter pour chaque namespace où le CronJob doit tourner —
#       en pratique : `beown` (production) au minimum)
#
# ⚠ À FAIRE PAR LE FONDATEUR, hors de ce dépôt :
#   - créer le bucket de sauvegarde chez le fournisseur de stockage objet,
#     dans une RÉGION UE (données personnelles — RGPD) ;
#   - y activer le versioning et un verrou de suppression si le fournisseur le
#     propose : un attaquant ayant obtenu ces identifiants pourrait sinon
#     effacer les sauvegardes avant de s'en prendre à la base ;
#   - créer un utilisateur/clé DÉDIÉ à la sauvegarde, avec les seules
#     permissions PutObject / ListBucket / DeleteObject sur ce bucket, et rien
#     d'autre ;
#   - conserver BACKUP_ENCRYPTION_KEY HORS du cluster (gestionnaire de mots de
#     passe). Sans elle, les sauvegardes sont définitivement illisibles : elle
#     ne doit exister ni sur le même compte cloud, ni sur le même bucket.
#     Génération : `openssl rand -base64 48`
# ─────────────────────────────────────────────────────────────────────────────
stringData:
  # Phrase de passe du chiffrement AES-256 (openssl enc -pbkdf2).
  # ⚠ La perdre = perdre TOUTES les sauvegardes. La changer = les anciennes
  # sauvegardes restent lisibles avec l'ancienne, à conserver aussi.
  BACKUP_ENCRYPTION_KEY: 'A_COMPLETER'

  # Stockage objet compatible S3.
  # Exemples d'endpoint :
  #   AWS S3              https://s3.eu-west-3.amazonaws.com
  #   Google Cloud Storage https://storage.googleapis.com   (API d'interopérabilité)
  #   Scaleway            https://s3.fr-par.scw.cloud
  #   MinIO auto-hébergé  https://minio.interne.beown.fr
  BACKUP_S3_ENDPOINT: 'A_COMPLETER'
  BACKUP_S3_BUCKET: 'A_COMPLETER'
  BACKUP_S3_REGION: 'A_COMPLETER'
  BACKUP_S3_ACCESS_KEY_ID: 'A_COMPLETER'
  BACKUP_S3_SECRET_ACCESS_KEY: 'A_COMPLETER'
