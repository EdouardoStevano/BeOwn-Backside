---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: beown
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--appendonly", "yes"]
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: redis-storage
          emptyDir: {}   # Remplacer par un PVC si persistance Redis requise

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: beown
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
