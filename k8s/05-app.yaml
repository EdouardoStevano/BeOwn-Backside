---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beown-backend
  namespace: beown
  labels:
    app: beown-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beown-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: beown-backend
    spec:
      # Attendre que postgres et redis soient prêts avant le premier pod
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "En attente de PostgreSQL..."; sleep 2;
              done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis-service 6379; do
                echo "En attente de Redis..."; sleep 2;
              done
      containers:
        - name: beown-backend
          # Remplacer par l'image buildée et poussée dans votre registry
          image: ravikazaha/beown-backside:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: beown-backend-config
            - secretRef:
                name: beown-backend-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: beown-backend-service
  namespace: beown
spec:
  # type: LoadBalancer
  selector:
    app: beown-backend
  ports:
    - port: 8080
      targetPort: 8080
