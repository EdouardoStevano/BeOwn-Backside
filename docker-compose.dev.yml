services:
  dev:
    build:
      context: .
      dockerfile: ./dockerfiles/dev.dockerfile
    env_file:
      - ./.env.development
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      db-dev:
        condition: service_healthy

    ports:
      - '3001:3000'

  db-dev:
    image: postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DB}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis-dev:
    image: redis
    volumes:
      - redis_data_dev:/data

volumes:
  postgres_data_dev:
  redis_data_dev:
